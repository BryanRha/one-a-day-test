<style>
.lk{max-width:420px;margin:12vh auto 0;padding:0 20px;text-align:center}

<!-- 바깥 브라우저 로그인 → 원스토어 앱으로 돌아가기 (2026-11-27 · 테스트 서버 입구 밖 · 앱 세션은 여기로 오지 않음) -->
<main class="lk">
  <div id="go">
    <h1>원어데이 로그인</h1>
    <p>여기서 로그인하면, 원스토어 앱의 원어데이가 이 계정으로 이어져요.</p>
    <button type="button" id="kbtn" class="kk" hidden>카카오로 로그인</button>
    <button type="button" id="gbtn">구글로 로그인</button>
  </div>
  <div id="done" hidden>
    <div class="ok">✓</div>
    <h1>로그인됐어요</h1>
    <p>폰의 <b>뒤로 가기</b>를 누르면 원어데이로 돌아가요.<br>돌아가면 잠시 뒤 로그인된 화면으로 바뀌어요.</p>
  </div>
  <div id="bad" hidden><h1>이을 수 없어요</h1><p id="why">원스토어 앱에서 다시 눌러 주세요.</p></div>
