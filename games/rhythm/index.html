<!doctype html>
<html lang="ko">
<head><!--oad:test--><script>/* 테스트 환경: localStorage 키 앞에 test: 를 붙여 서비스와 분리 */(function(){var P='test:',S=Storage.prototype,g=S.getItem,s=S.setItem,r=S.removeItem,k=S.key;if(S.__t)return;S.__t=1;
S.getItem=function(x){return g.call(this,P+x)};S.setItem=function(x,v){return s.call(this,P+x,v)};S.removeItem=function(x){return r.call(this,P+x)};
S.key=function(i){var a=[];for(var j=0;j<this.length;j++){var y=k.call(this,j);if(y&&y.indexOf(P)===0)a.push(y.slice(P.length))}return a[i]===undefined?null:a[i]};
S.clear=function(){for(var j=this.length-1;j>=0;j--){var y=k.call(this,j);if(y&&y.indexOf(P)===0)r.call(this,y)}};})();</script><!--/oad:test--><!--oad:env--><script>window.OAD_ENV='test'</script>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070816">
<title>프로듀서 온에어 · 오늘 밤 한 곡, 끝까지 송출</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/NanumMyeongjo-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">
  <div id="box">
    <!-- ① 오늘의 한 곡 -->
    <section id="today" class="scr">
      <div class="hero"></div>
      <div class="top">
        <button class="ic" id="t_back" aria-label="원어데이로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="logo onair"><i class="lamp"></i>프로듀서 온에어</div>
        <span class="rbtn"><button class="ic" id="t_cast" aria-label="캐스트"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.4 3-5.2 6-5.2s5.4 1.8 6 5.2"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 13.9c2.6.2 4.4 1.8 4.9 4.6"/></svg></button><button class="ic" id="t_list" aria-label="방송 목록"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></button>
        <button class="ic" id="t_book" aria-label="방송 기록"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"/><path d="M12 6v13.5"/></svg></button></span>
      </div>
      <div class="info">
        <span class="pill" id="t_no">TONIGHT · NO.001</span><span class="pill2" id="t_ch">1화</span>
        <div class="ttl" id="t_title"></div>
        <div class="comp" id="t_comp"></div>
        <div class="chips">
          <div>BPM <b class="tnum" id="t_bpm"></b></div><div>길이 <b class="tnum" id="t_len"></b></div>
          <button class="sync" id="t_sync">싱크 <b class="tnum" id="t_off">±0</b></button>
        </div>
      </div>
      <div class="diva">
        <div class="av" id="t_av"></div>
        <div class="tx">
          <div class="nm"><em>CAST</em><b id="t_dn"></b><span id="t_dr"></span></div>
          <q id="t_hello"></q>
          <button class="guestb" id="t_guest"></button>
          <div class="steps" id="t_steps"></div>
        </div>
      </div>
      <div class="diff" id="t_diff"></div>
      <div class="hint" id="t_hint"><i>?</i><span></span></div>
      <button class="start onair" id="t_start"><b><i class="lamp"></i>생방송 시작</b><span>오늘 무제한 무료</span></button>
    </section>

    <!-- ①-2 방송 전 (화면 밖) -->
    <section id="pre" class="scr"></section>
    <!-- ② 플레이 (생방송) -->
    <section id="play" class="scr">
      <div class="shake" id="p_shake">
        <div class="cov" id="p_cov"></div><div class="shade"></div>
        <canvas id="p_cv" width="390" height="844"></canvas>
        <div class="hud">
          <div class="thumb" id="p_thumb"></div>
          <div class="song"><b id="p_title"></b><span id="p_sub"></span></div>
          <div class="score"><b class="tnum" id="p_score">0</b><span>SCORE</span></div>
        </div>
        <div class="prog"><span class="tnum" id="p_t">0:00</span><div class="bar"><i id="p_bar"></i></div><span class="tnum" id="p_len"></span></div>
        <button class="pause" id="p_pause" aria-label="멈춤"></button>
        <div class="acc">정확도 <em class="tnum" id="p_acc">100.00%</em></div>
        <div class="chap" id="p_chap"></div>
        <div class="combo" id="p_combo"><span>COMBO</span><b class="tnum">0</b></div>
        <div class="judge" id="p_judge"><b></b><small></small></div>
        <div class="live" id="p_live"><i></i>LIVE<span>시청</span><b>0</b></div>
        <div class="chat" id="p_chat"></div>
        <div class="hearts" id="p_hearts"></div>
        <div class="cutin" id="p_cut"><div class="face"></div><div class="say"><small></small><span></span></div></div>
        <div class="intro" id="p_intro"><em></em><b></b><span></span><i></i></div>
        <div class="guide" id="p_guide"></div>
        <div class="ready" id="p_ready"><b></b></div>
        <div class="scb" id="p_sc"></div>
        <div class="guardc" id="p_guard"><b>수습!</b><span></span></div>
        <div class="prac" id="p_prac"></div>
        <div class="mile" id="p_mile"><b></b><span>COMBO</span></div>
        <div class="banner" id="p_banner"><b></b><span></span></div>
        <div class="fcm" id="p_fc"><div class="fc-glow"></div><div class="fc-face"></div><b></b><span></span></div>
        <div class="touch" id="p_touch"></div>
      </div>
    </section>

    <!-- ③ 결과 -->
    <section id="result" class="scr"></section>
    <!-- ④ 개인 채널 (방송 후 DM · 오늘의 조각) -->
    <section id="story" class="scr"></section>
    <!-- ⑤ 방송 기록 -->
    <section id="book" class="scr"></section>
    <!-- ⑧ 캐스트 목록 · 옆자리 게스트 -->
    <section id="casts" class="scr"></section>
    <!-- ⑦ 방송 목록 (지난 방송 다시 고르기) -->
    <section id="stages" class="scr"></section>
    <!-- ⑥ 싱크 맞추기 -->
    <section id="calib" class="scr"></section>

    <div id="sheet"></div>
    <div id="modal"></div>
    <div id="toast"></div>
    <div id="boot"><b>프로듀서 온에어</b><span>옥상 방송실을 켜고 있어요</span><i></i></div>
  </div>
</div>
<script type="module" src="src/main.js?v=0.99.32"></script>
</body>
</html>
