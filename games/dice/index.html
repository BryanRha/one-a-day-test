<!doctype html>
<html lang="ko">
<head><script>/* 테스트 환경: localStorage 키 앞에 test: 를 붙여 서비스와 분리 */(function(){var P='test:',S=Storage.prototype,g=S.getItem,s=S.setItem,r=S.removeItem,k=S.key;if(S.__t)return;S.__t=1;
S.getItem=function(x){return g.call(this,P+x)};S.setItem=function(x,v){return s.call(this,P+x,v)};S.removeItem=function(x){return r.call(this,P+x)};
S.key=function(i){var a=[];for(var j=0;j<this.length;j++){var y=k.call(this,j);if(y&&y.indexOf(P)===0)a.push(y.slice(P.length))}return a[i]===undefined?null:a[i]};
S.clear=function(){for(var j=this.length-1;j>=0;j--){var y=k.call(this,j);if(y&&y.indexOf(P)===0)r.call(this,y)}};})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1026">
<title>룬 다이스 - Rune Dice</title>
<meta name="description" content="룬 주사위를 소환하고 합성해 고대 제단을 지키는 디펜스">

  @font-face { font-family: 'Pretendard'; src: url('fonts/Pretendard-ExtraBold.woff2') format('woff2'); font-weight: 800; font-display: block; }
  @font-face { font-family: 'Pretendard'; src: url('fonts/Pretendard-Black.woff2') format('woff2'); font-weight: 900; font-display: block; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0B1026; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); left: 0; right: 0; }
  canvas { display: block; }
</style>
</head>

</html>
