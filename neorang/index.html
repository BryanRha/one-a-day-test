<style>
/* 너랑 — 대표 승인 시안 D(lab/neorang-ux/d · 2026-11-04 "너무 마음에 든다")를 실제 앱으로 (근거 team/dev/tasks/261104-neorang/ux-benchmark.md)
   뼈대 = 국내 웹소설 앱의 익숙함(밝은 서점형 홈 · 세로 스크롤 뷰어 · 회차 목록 · 서재)
   + AI 대화 앱의 술술(먼저 말 걸기 · 답 칩 · 다른 반응 · 관계 단계 · 장면 카드).
   읽기는 밝은 종이, 둘만의 대화는 '밤 9시' 남색 — 화면 색이 바뀌는 순간이 '공통 장면 → 나만의 이야기' 전환.
   아래 CSS 는 시안 D 그대로 + 실제 앱에 필요한 것(원어데이 안에 넣기 · 새 내용 표시 · 글 카드 · 불러오는 중)만 덧붙임 */
:root {
  --bg: #F6F4F0; --sf: #FFFFFF; --sf2: #EFECE6; --ink: #18171D; --ink2: #56535D; --ink3: #98949E; --line: #E6E2DB;

  --vi: #5B48E2; --vi2: #ECE9FD; --co: #FF6F4A; --co2: #FFEDE6; --gd: #E7B24A;
  --sans: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif; --serif: 'Noto Serif KR', 'AppleMyungjo', serif;
  --rp: #FFFFFF; --rtx: #1E1D22; --rtx2: #6B6872; --rfs: 18px; --rff: var(--sans);
}
body.th-cream { --rp: #F6F0E4; --rtx: #2A251E; --rtx2: #7C7365; }
body.th-night { --rp: #131219; --rtx: #D8D5E2; --rtx2: #8B879A; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: #DEDAD3; }
body { margin: 0 auto; max-width: 480px; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; overflow-x: hidden; position: relative; }
@media (min-width: 520px) { body { box-shadow: 0 0 60px rgba(0,0,0,.12); } }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; }

.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.s { width: 16px; height: 16px; } .ic.xs { width: 13px; height: 13px; stroke-width: 2.2; }
.hide { display: none !important; }

/* 공통 머리 */

/* ── 읽기 (공통 장면) ── */

.handoff { margin: 26px 0 0; padding: 30px 20px 40px; background: var(--nt); color: var(--ntx); border-radius: 28px 28px 0 0; position: relative; }

.ping { display: flex; gap: 12px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.08); margin-bottom: 16px; text-align: left; width: 100%; animation: pingin .6s ease both .3s; }

/* 보기 설정 시트 */
.dim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 60; }
.sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; background: var(--sf); color: var(--ink); border-radius: 24px 24px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); z-index: 61; animation: up .25s ease; }

/* ── 둘만의 대화 ── */

.thead .r1 { display: flex; align-items: center; gap: 8px; height: 58px; padding: 0 10px; }

.bond .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--vi), #9C8CFF); border-radius: 2px; transition: width .6s; }
.bond b { color: #fff; }
.log { padding: 14px 14px 12px; }
.lg-rc { margin: 6px 4px 14px; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); font-family: var(--serif); font-size: 13.5px; line-height: 1.75; color: var(--ntx2); }
.lg-rc small { display: flex; justify-content: space-between; font-family: var(--sans); font-size: 11.5px; color: var(--ntx3); margin-bottom: 6px; } .lg-rc small b { color: var(--ntx2); font-weight: 600; }
.lg-rc p { margin: 0 0 4px; }
.lg-sc { display: flex; justify-content: center; margin: 14px 0; }
.lg-sc span { font-size: 11.5px; color: var(--ntx2); background: rgba(255,255,255,.06); padding: 5px 12px; border-radius: 12px; }
.lg-n { margin: 12px 18px; text-align: center; font-size: 13.5px; color: var(--ntx2); line-height: 1.7; font-family: var(--serif); }
.lg-c { display: flex; gap: 9px; margin: 6px 0; align-items: flex-start; }

.lg-c .bb { max-width: 80%; background: rgba(255,255,255,.1); border-radius: 4px 18px 18px 18px; padding: 10px 14px; font-size: 15.5px; line-height: 1.55; color: #fff; }

.lg-m { display: flex; justify-content: flex-end; margin: 12px 0; }
.lg-m .bb { max-width: 78%; background: var(--vi); color: #fff; border-radius: 18px 4px 18px 18px; padding: 10px 14px; font-size: 15.5px; line-height: 1.5; }
.alt { display: inline-flex; align-items: center; gap: 5px; margin: 4px 0 0 43px; height: 28px; padding: 0 10px; border-radius: 14px; font-size: 12px; color: var(--ntx2); background: rgba(255,255,255,.05); }
.lg-pr { display: flex; justify-content: center; margin: 12px 0; }
.lg-pr span { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: #FFD7A8; background: rgba(231,178,74,.12); border: 1px solid rgba(231,178,74,.28); padding: 7px 12px; border-radius: 14px; line-height: 1.35; max-width: 92%; }
.lg-st { margin: 18px 8px; padding: 16px; border-radius: 20px; text-align: center; background: linear-gradient(135deg, rgba(91,72,226,.5), rgba(255,111,74,.25)); border: 1px solid rgba(255,255,255,.12); }
.lg-st small { font-size: 12px; color: var(--ntx2); } .lg-st b { display: block; font-size: 19px; color: #fff; margin: 4px 0; letter-spacing: -.03em; }
.lg-st p { margin: 0; font-size: 12.5px; color: var(--ntx); }
.lg-card { display: flex; gap: 12px; align-items: center; margin: 12px 8px; padding: 10px; border-radius: 16px; background: rgba(255,255,255,.06); }
.lg-card .ph { width: 56px; height: 72px; border-radius: 10px; background: center/cover; flex: none; box-shadow: 0 0 0 1.5px var(--gd); }
.lg-card small { color: var(--gd); font-size: 11.5px; font-weight: 700; } .lg-card b { display: block; color: #fff; font-size: 14px; }
.lg-card span { font-size: 12px; color: var(--ntx3); }
.lg-sec { margin: 12px 8px; padding: 14px; border-radius: 16px; background: rgba(231,178,74,.08); border: 1px dashed rgba(231,178,74,.45); }
.lg-sec small { color: var(--gd); font-size: 11.5px; font-weight: 800; display: flex; gap: 5px; align-items: center; } .lg-sec p { margin: 5px 0 0; font-size: 14px; color: #fff; line-height: 1.5; }
.lg-end { margin: 20px 8px 6px; padding: 18px; border-radius: 20px; background: #fff; color: var(--ink); text-align: center; }
.lg-end b { display: block; font-size: 16px; margin-bottom: 4px; } .lg-end p { margin: 0 0 12px; font-size: 13px; color: var(--ink2); }
.typing { display: inline-flex; gap: 4px; padding: 14px; } .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ntx2); animation: ty 1s infinite; } .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes ty { 50% { opacity: .25; transform: translateY(-2px); } }
.dock { position: sticky; bottom: 0; z-index: 20; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(22,19,58,0), var(--nt) 18%); }
.sugs { display: grid; gap: 7px; margin-bottom: 9px; }
.sugs button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 11px 14px; border-radius: 15px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); font-size: 14.5px; color: #fff; line-height: 1.4; }

.sugs button em { font-style: normal; font-size: 11px; font-weight: 800; color: var(--ntx2); background: rgba(255,255,255,.08); padding: 2px 7px; border-radius: 6px; flex: none; }
.inrow { display: flex; gap: 8px; align-items: center; }
.inrow input { flex: 1; min-width: 0; height: 48px; border-radius: 24px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #fff; padding: 0 18px; font-size: 15px; outline: 0; }
.inrow input::placeholder { color: var(--ntx3); }
.inrow .send { width: 48px; height: 48px; border-radius: 50%; background: var(--vi); display: grid; place-items: center; color: #fff; flex: none; }
.dock .hint { text-align: center; font-size: 11.5px; color: var(--ntx3); margin-top: 8px; }

/* ── 회차 끝 ── */
.end { background: var(--nt); color: var(--ntx); min-height: 100vh; padding-bottom: 40px; }

.rec4 { margin: 20px 18px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.rec4 small { font-size: 12px; color: var(--ntx3); } .rec4 b { display: block; font-size: 18px; color: #fff; margin-top: 4px; letter-spacing: -.03em; line-height: 1.3; }

.frame { margin: 22px 18px 0; border-radius: 22px; overflow: hidden; background: #fff; color: var(--ink); }

.cd { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--bg); }
.cd .t { flex: 1; font-size: 12.5px; color: var(--ink2); } .cd .t b { display: block; font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

.endmore .x { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: rgba(255,255,255,.06); margin-bottom: 8px; width: 100%; text-align: left; }
.endmore .x .cv { width: 46px; height: 60px; border-radius: 8px; } .endmore .x .cv::after { display: none; }
.endmore .x b { display: block; color: #fff; font-size: 14px; } .endmore .x small { color: var(--ntx3); font-size: 12px; }

/* ── 서재 ── */
.ltabs { display: flex; gap: 20px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.ltabs button { height: 44px; font-size: 15px; font-weight: 700; color: var(--ink3); position: relative; }
.ltabs button.on { color: var(--ink); } .ltabs button.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }

.lrow .m { flex: 1; min-width: 0; }

.lrow .m .q { font-size: 13px; color: var(--ink2); margin: 4px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .m .bar { height: 3px; border-radius: 2px; background: var(--sf2); overflow: hidden; } .lrow .m .bar i { display: block; height: 100%; background: var(--vi); }
.lrow .m .ft { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink3); margin-top: 5px; }
.lrow .un { min-width: 22px; height: 22px; border-radius: 11px; background: var(--co); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 18px; }
.cards .k { border-radius: 16px; overflow: hidden; background: var(--sf); border: 1px solid var(--line); }

.cards .k div:last-child { padding: 9px 11px 11px; } .cards .k b { display: block; font-size: 13.5px; } .cards .k small { font-size: 11.5px; color: var(--ink3); }
.cards .k.new { box-shadow: 0 0 0 2px var(--gd); }
.mine { padding: 16px 18px; }
.mine .grp { background: var(--sf); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
.mine .gh { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; } .mine .gh b { font-size: 15px; flex: 1; }
.mine h6 { margin: 14px 0 8px; font-size: 12.5px; color: var(--ink3); font-weight: 700; display: flex; justify-content: space-between; }
.mine .sx { padding: 11px 12px; border-radius: 12px; background: var(--nt); color: var(--ntx); font-size: 13.5px; margin-bottom: 6px; display: flex; gap: 8px; }
.mine .sx.lk { background: var(--sf2); color: var(--ink3); }
.mine ul { margin: 0; padding: 0; list-style: none; } .mine li { font-size: 13.5px; color: var(--ink2); padding: 7px 0 7px 14px; position: relative; border-bottom: 1px dashed var(--line); }
.mine li::before { content: ''; position: absolute; left: 2px; top: 15px; width: 4px; height: 4px; border-radius: 50%; background: var(--vi); }
.mine .cap { font-size: 12px; color: var(--ink3); margin-top: 8px; }

/* ── 알림 · 충전 ── */
.day { margin: 8px 18px 0; padding: 18px; border-radius: 22px; background: var(--nt); color: var(--ntx); }

.tl { position: relative; padding-left: 22px; }
.tl::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: rgba(255,255,255,.12); }

.nlist { margin: 0 18px; background: var(--sf); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }

.setlist { margin: 0 18px; background: var(--sf); border: 1px solid var(--line); border-radius: 20px; padding: 0 16px; }

.setlist button:last-child { border-bottom: 0; }
.setlist .t { flex: 1; font-size: 14.5px; } .setlist .t small { display: block; color: var(--ink3); font-size: 12px; }

/* ── 패스 ── */
.pass { background: var(--nt); color: var(--ntx); min-height: 100vh; padding-bottom: 40px; position: relative; overflow: hidden; }
.pass::before { content: ''; position: absolute; left: -30%; right: -30%; top: -140px; height: 460px; background: radial-gradient(closest-side, rgba(91,72,226,.55), transparent), radial-gradient(closest-side at 75% 70%, rgba(255,111,74,.22), transparent); }
.pass > * { position: relative; }
